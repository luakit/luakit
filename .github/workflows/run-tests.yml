    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y \
          build-essential \
          ccache \
          luajit \
          libluajit-5.1-dev \
          libjavascriptcoregtk-4.1-dev \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
