  debian:
    if: github.event_name != 'workflow_dispatch' || inputs.test_debian
    name: Debian Stable
    runs-on: ubuntu-latest
    container: debian:stable
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Cache APT packages
