name: Tests

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgtk-3-dev \
          libwebkit2gtk-4.0-dev \
          libsqlite3-dev \
          lua5.1 \
          liblua5.1-0-dev \
          luajit \
          libluajit-5.1-dev \
          lua-filesystem \
          xvfb \
          xauth \
          dbus-x11
    
    - name: Build luakit
      run: make
    
    - name: Run tests
      run: xvfb-run -a make run-tests
